<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
        
@keyframes bounce {
  0%   { transform: translateY(0) scale(1.3, 0.7);  animation-timing-function: ease-in; }
  8%   { transform: translateY(0) scale(1, 1);      animation-timing-function: ease-out; }
  50%  { transform: translateY(-400px) scale(1, 1); animation-timing-function: ease-in; }
  92%  { transform: translateY(0) scale(1, 1);      animation-timing-function: ease-out; }
  100% { transform: translateY(0) scale(1.3, 0.7); }
                    }

    .balls{
                display: flex;
        }
    
    .ball {
      width: 80px;
      height: 80px;
      background: blue;
      border-radius: 50%;
      margin: 410px 30px 0px 20px;
    transform-origin: bottom;
      animation: bounce 1.5s infinite;
            }
    .two{
    background: gold;
    animation-delay: 0.3s;
            }
            
        </style>
    </head>
    <body>
      <div class="balls">
        <div class="ball"></div>
        <div class="ball two"></div>
          <div class="ball"></div>
          </div>
        <hr style="margin: 0px">
    

    </body>
</html>
