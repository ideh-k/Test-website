<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
            .wrapper{
                text-align: center;
                width:100%;
                background-color:#dadada;
                position: relative;
            }
            .centered {
                position: absolute;
                top: 30%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-family: monospace;
                font-size: 50px;
                        }
        </style>
    </head>
    <body>
        <div class="wrapper">
        <img src="../img/clouds.jpg" alt="clouds" style="width:100%;">
            <div class="centered"><p><strong>Welcome to my Website</strong></p></div>
        </div>
    </body>
</html>
